sonar.projectKey=jappend

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=coverage/test-report.xml

sonar.sources=src
# SonarQube supports limited wildcards (https://docs.sonarqube.org/latest/project-administration/narrowing-the-focus).
# Exclude test files from analysis.
sonar.exclusions=**/*.test.*
# Index test files as tests, or SonarQube drops their entries from the test execution report.
sonar.tests=tests
sonar.test.inclusions=**/*.test.*,**/*.integ.*
