name: Release
run-name: Release ${{ inputs.version }} on ${{ github.ref }} branch

on:
  workflow_dispatch:
    inputs:
      github-ref:
        required: true
        type: string
        default: 'main'
        description: Ref to build
      version:
        required: true
        type: string
        description: Version to release
      dry-run:
        type: boolean
        description: Dry run
      skip-changelog-update:
        type: boolean
        description: Skip CHANGELOG update

jobs:
  release:
    runs-on: ubuntu-latest
    name: Release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.github-ref || github.sha }}

      - name: Configure Git identity
        run: |
          git config --global user.email "github-actions@users.noreply.github.com"
          git config --global user.name "github-actions"
      
      - name: Authenticate Git
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/karpov-kir/jappend.git

      - name: Bun prepare
        uses: kk-forge-engineering/gh-actions/bun-prepare@v1

      - name: Build
        run: bun run build

      - name: Release to NPM
        run: npm run release
        env:
          VERSION: ${{ inputs.version }}
          NPM_PUBLISH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          DRY_RUN: ${{ inputs.dry-run }}
          SKIP_CHANGELOG_UPDATE: ${{ inputs.skip-changelog-update }}
