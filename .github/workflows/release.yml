name: Release
run-name: Release ${{ inputs.version }} on ${{ github.ref }} branch

on:
  workflow_dispatch:
    inputs:
      github-ref:
        required: true
        type: string
        default: 'main'
        description: Ref to build
      version:
        required: true
        type: string
        description: Version to release
      dry-run:
        type: boolean
        description: Dry run
      skip-changelog-update:
        type: boolean
        description: Skip CHANGELOG update

jobs:
  release:
    runs-on: ubuntu-24.04
    # release.sh pushes the version commit and tag.
    permissions:
      contents: write
    name: Release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.github-ref || github.sha }}
          # `setup` runs third-party install scripts, so the write token stays out of .git/config until the release step.
          persist-credentials: false

      - name: Configure Git identity
        run: |
          git config --global user.email "github-actions@users.noreply.github.com"
          git config --global user.name "github-actions"

      - name: Install the tools from mise.toml
        uses: jdx/mise-action@v5

      - run: mise run setup

      - name: Build
        run: mise run build

      - name: Release to NPM
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          npm run release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          NPM_PUBLISH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          DRY_RUN: ${{ inputs.dry-run }}
          SKIP_CHANGELOG_UPDATE: ${{ inputs.skip-changelog-update }}
